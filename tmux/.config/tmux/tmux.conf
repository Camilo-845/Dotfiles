# 1. RESET Y COMPATIBILIDAD (Corregido para evitar bucles)
source-file ~/.config/tmux/tmux.reset.conf

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g base-index 1              # Ventanas empiezan en 1
set -g escape-time 0             # Vital para Neovim
set -g mouse on                  # Activa el ratón por si acaso
set -g renumber-windows on       
set -g status-position top       
setw -g mode-keys vi

# -----------------------------------------------------------------------------
# 2. ESTÉTICA MANUAL (Estilo Catppuccin Mocha)
# -----------------------------------------------------------------------------
# Colores base
# Fondo: #1e1e2e | Texto: #cdd6f4 | Magenta: #cba6f7 | Azul: #89b4fa

set -g status-style "bg=default,fg=#cdd6f4" # Fondo transparente
set -g status-left-length 50
set -g status-right-length 50

# --- Panel de Bordes ---
set -g pane-active-border-style 'fg=#cba6f7,bg=default'
set -g pane-border-style 'fg=#313244,bg=default'

# --- Barra de Estado Izquierda (Sesión) ---
set -g status-left "#{?pane_in_mode,COPY ,}#{?client_prefix,#[fg=#f9e2af]#[bg=default],#[fg=#89b4fa]#[bg=default]}#{?client_prefix,#[fg=#1e1e2e]#[bg=#f9e2af]#[bold],#[fg=#1e1e2e]#[bg=#89b4fa]#[bold]} #S#{?client_prefix,#[fg=#f9e2af]#[bg=default],#[fg=#89b4fa]#[bg=default]} "

# --- Barra de Estado Derecha (Directorio) ---
set -g status-right "#[fg=#cba6f7,bg=default] #[fg=#1e1e2e,bg=#cba6f7,bold] #{b:pane_current_path}#[fg=#cba6f7,bg=default]"

# --- Configuración de las Ventanas (Tabs) ---
# Ventana inactiva
setw -g window-status-format "#[fg=#313244,bg=default]#[fg=#cdd6f4,bg=#313244]#I#[fg=#313244,bg=#45475a]█#[fg=#cdd6f4,bg=#45475a] #W #[fg=#45475a,bg=default]"

# Ventana activa
setw -g window-status-current-format "#[fg=#fab387,bg=default]#[fg=#1e1e2e,bg=#fab387,bold]#I#[fg=#fab387,bg=#1e1e2e]█#[fg=#cdd6f4,bg=#1e1e2e,bold] #W#{?window_zoomed_flag,(),} #[fg=#1e1e2e,bg=default]"

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
