# First remove *all* keybindings
unbind-key -a
# Now reinsert all the regular tmux keys
bind ^X lock-server
bind ^C new-window -c "$HOME"
bind ^D detach
# bind * list-clients

bind H previous-window
bind L next-window

bind r command-prompt "rename-window %%"
bind R source-file ~/.config/tmux/tmux.conf
bind ^A last-window
bind ^W list-windows
bind w list-windows
bind z resize-pane -Z
bind ^L refresh-client
bind l refresh-client
bind | split-window
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind '"' choose-window
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20
bind -r -T prefix - resize-pane -D 7
bind -r -T prefix = resize-pane -U 7
bind : command-prompt
bind * setw synchronize-panes
bind P set pane-border-status
bind d kill-pane
bind x swap-pane -D
bind S choose-session
bind K send-keys "clear"\; send-keys "Enter"

bind-key -r 0 select-window -t :10
bind-key -r 1 select-window -t :1
bind-key -r 2 select-window -t :2
bind-key -r 3 select-window -t :3
bind-key -r 4 select-window -t :4
bind-key -r 5 select-window -t :5
bind-key -r 6 select-window -t :6
bind-key -r 7 select-window -t :7
bind-key -r 8 select-window -t :8
bind-key -r 9 select-window -t :9
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Entrar en el modo de copia para poder usar las teclas de vi
bind-key [ copy-mode
