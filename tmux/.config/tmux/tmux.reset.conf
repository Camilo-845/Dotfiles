# 1. LIMPIEZA Y PREFIJO
unbind-key -a

# 2. NAVEGACIÓN DE VENTANAS (Rápida y sin repetición innecesaria)
bind c new-window -c "#{pane_current_path}"
bind ^D detach
bind H previous-window
bind L next-window
bind ^B last-window
bind ^W list-windows
bind w list-windows
bind '"' choose-window

# 3. GESTIÓN DE PANELES (Vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind z resize-pane -Z
bind x swap-pane -D      # Se añadió -D para que el swap sea predecible
bind d kill-pane
bind m select-pane -m    # Mark pane

# División de pantalla (intuitivo)
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# 4. REDIMENSIONADO (Uso de -r para poder repetir sin presionar prefijo)
bind -r C-Up    resize-pane -U 5
bind -r C-Down  resize-pane -D 5
bind -r C-Left  resize-pane -L 5
bind -r C-Right resize-pane -R 5

# 5. COMANDOS DE SISTEMA
bind r command-prompt "rename-window %%"
bind R source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"
bind : command-prompt
bind * setw synchronize-panes
bind P set pane-border-status
bind S choose-session
bind . command-prompt -p "Swap window with:" "swap-window -t '%%'"
bind L refresh-client   # Cambiado de C-l a L para no chocar con Neovim

# 6. SELECCIÓN DE VENTANAS (Simplificado)
bind-key 0 select-window -t :10
bind-key 1 select-window -t :1
bind-key 2 select-window -t :2
bind-key 3 select-window -t :3
bind-key 4 select-window -t :4
bind-key 5 select-window -t :5
bind-key 6 select-window -t :6
bind-key 7 select-window -t :7
bind-key 8 select-window -t :8
bind-key 9 select-window -t :9

# 7. MODO COPIA (VI STYLE)
bind-key [ copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# 8. INTEGRACIÓN SMART CON NEOVIM (Optimización de Script)
# Movido a variables de una sola línea para evitar errores de lectura
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# Recuperar Clear Screen (ahora con Prefijo + C-l)
bind C-l send-keys 'C-l'
